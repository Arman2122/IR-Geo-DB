name: Build and release

on:
  schedule:
    # 03:30 UTC daily — after the RIR delegated-stats files have rolled over
    # for the day, and outside the hour when every other cron job fires.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — do not publish"
        type: boolean
        default: false
      allow_shrink:
        description: "Publish even if a set shrank beyond its day-over-day limit (after reviewing why)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

# A scheduled run and a manual run must never race for the same tag.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set build version
        id: meta
        run: |
          echo "version=v$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          for t in build/test_*.py; do echo "== $t"; python3 "$t" || exit 1; done

      # The compilers are pinned and checksummed rather than fetched as
      # "latest": they run in a job that can write to the repository, and an
      # upstream release that is mid-upload or changes behaviour should not
      # take the daily build down. Dependabot cannot see these; bump them by
      # hand, taking the sha256 from the asset's "digest" in the releases API.
      - name: Install sing-box
        env:
          VER: "1.14.0"
          SHA256: 2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63
        run: |
          set -euo pipefail
          curl -sfL --retry 5 --retry-all-errors -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          echo "${SHA256}  sb.tar.gz" | sha256sum -c -
          tar xzf sb.tar.gz
          sudo install -m755 "sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          rm -rf sb.tar.gz "sing-box-${VER}-linux-amd64"
          sing-box version

      - name: Install mihomo
        env:
          VER: "v1.19.30"
          SHA256: cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84
        run: |
          set -euo pipefail
          curl -sfL --retry 5 --retry-all-errors -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
          echo "${SHA256}  mihomo.gz" | sha256sum -c -
          gunzip -f mihomo.gz
          sudo install -m755 mihomo /usr/local/bin/mihomo
          rm -f mihomo
          mihomo -v

      # The state store (spec 6.2): the last validated copy of every upstream
      # input, on an orphan `state` branch of this repository, so a source that
      # is down today is served from its stored copy. A missing branch is just
      # the first run. Any other failure to read it stops the job: carrying on
      # with an empty store would let the save step below replace the branch
      # with it and lose every copy that this run did not re-fetch.
      - name: Restore state
        run: |
          set -euo pipefail
          mkdir -p .lkg
          if git fetch --no-tags --depth 1 origin state; then
            git archive FETCH_HEAD | tar -x -C .lkg
          else
            # exit code 2 means "no such ref"; anything else is a real failure
            rc=0
            git ls-remote --exit-code --heads origin state >/dev/null || rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "::error::could not read the state branch (ls-remote exit $rc)"
              exit 1
            fi
            echo "no state branch yet (first run)"
          fi
          ls .lkg | wc -l

      # --require-binaries turns a missing compiler into a hard failure, so a
      # release can never silently ship without the .srs / .mrs rule-sets.
      # --allow-shrink is the override for the set-level day-over-day guard,
      # reachable only from a manual run, after a human has read why.
      - name: Build
        id: build
        run: |
          python3 build/build.py \
            --outdir dist \
            --version "${{ steps.meta.outputs.version }}" \
            --require-binaries \
            --lkg-dir .lkg \
            ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      - name: Verify
        run: python3 build/verify.py dist

      # Save the state store before anything below clears the work tree (the
      # dist step deletes everything but dist/ and .git). It also runs after a
      # failed Build: the store only ever adds or overwrites validated copies,
      # never deletes one, so .lkg is a superset of what was restored and a
      # failure cannot lose state. A dry run of unmerged code must not
      # overwrite the canonical state, so it is skipped there.
      - name: Save state
        if: ${{ always() && steps.build.outcome != 'skipped' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # an interrupted write can leave its temp file behind; never keep one
          find .lkg -maxdepth 1 -name '*.tmp' -delete 2>/dev/null || true
          if [ -z "$(ls -A .lkg 2>/dev/null)" ]; then
            echo "no validated inputs to save"
            exit 0
          fi
          cd .lkg
          git init -q
          git checkout -q -b state
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "state ${VERSION} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # a single orphan commit, force-pushed, the same pattern as dist
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/state

      - name: Release notes
        if: always()
        run: |
          # a build that died early has no stats to describe
          [ -f dist/stats.json ] || exit 0
          python3 build/release_notes.py \
            dist/stats.json "${{ steps.meta.outputs.version }}" > NOTES.md
          head -40 NOTES.md

      - name: Job summary
        if: always()
        run: |
          # a build that died early has no stats to summarise
          [ -f dist/stats.json ] || exit 0
          {
            echo "## ${{ steps.meta.outputs.version }}"
            echo ""
            python3 - <<'PY'
          import json
          s = json.load(open("dist/stats.json"))
          print("| set | kind | entries |")
          print("|---|---|---|")
          for k, v in s["ip_sets"].items():
              print(f"| `{k}` | ip | {v['ipv4'] + v['ipv6']:,} |")
          for k, v in s["domain_sets"].items():
              print(f"| `{k}` | domain | {v['suffix'] + v['full']:,} |")
          PY
            # the release notes' own "Source health" section, up to the next
            # "## " heading; absent when every source was served fresh
            if [ -f NOTES.md ]; then
              echo ""
              awk '/^## / { p = ($0 == "## Source health") } p' NOTES.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------- publishing
      # Two channels on purpose:
      #   release  — versioned, checksummed, what humans download
      #   dist     — a branch, so routers get a plain raw.githubusercontent.com
      #              URL. Release asset URLs redirect through
      #              objects.githubusercontent.com and RouterOS /tool fetch
      #              does not reliably follow redirects.

      - name: Publish release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # one release per day: replace today's if this is a re-run
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "replacing existing release $VERSION"
            gh release delete "$VERSION" --yes --cleanup-tag
            sleep 5
          fi
          # Loose files, not archives: v2ray, sing-box, mihomo and RouterOS
          # all fetch a single file by URL and cannot open a zip.
          echo "uploading $(ls release-assets | wc -l) assets"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file NOTES.md \
            --latest \
            release-assets/* \
            "ir-geo-db-${VERSION}.zip"

      - name: Push dist branch
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # orphan branch: dist holds only build output, never source history
          git checkout --orphan dist-tmp
          git rm -rf --cached . >/dev/null
          find . -maxdepth 1 ! -name . ! -name dist ! -name .git -exec rm -rf {} +
          mv dist/* . && rmdir dist
          git add -A
          git commit -q -m "build $VERSION (${{ steps.meta.outputs.date }})"
          git branch -M dist
          git push -f origin dist

      # jsDelivr caches branch refs, so a force-push to dist can keep serving
      # yesterday's file. Purging the paths people actually fetch keeps the
      # CDN honest — it matters because raw.githubusercontent.com is widely
      # blocked from Iran and the CDN is the working mirror.
      - name: Purge jsDelivr cache
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        continue-on-error: true
        run: |
          purge() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@dist/$1" || true)
            echo "  $code  $1"
          }
          for f in xray/geoip.dat xray/geoip-lite.dat xray/geosite-lite.dat \
                   manifest.json stats.json SHA256SUMS; do purge "$f"; done
          for s in ir ads ads-ir malware phishing cryptominers nsfw; do
            purge "sing-box/rule-set/geosite-${s}.srs"
            purge "mihomo/${s}-domain.mrs"
          done
          for s in ir ir-cdn ir-full private malware phishing; do
            purge "sing-box/rule-set/geoip-${s}.srs"
            purge "mihomo/${s}-ip.mrs"
            purge "text/${s}-ipv4.txt"
          done
          for f in ir-ipv4-reset.rsc ir-ipv4.rsc ir-ipv6-reset.rsc \
                   ir-dns.rsc auto-update.rsc adlist-block-all.txt; do
            purge "mikrotik/$f"
          done

      - name: Prune old releases
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # daily builds accumulate; keep the most recent 30
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | tail -n +31 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
