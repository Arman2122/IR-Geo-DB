name: Test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Compile check
        run: python3 -m compileall -q build/

      # The .dat writer is the one piece where a silent encoding mistake would
      # produce a file that loads but routes wrongly, so it round-trips itself
      # on every push.
      - name: geodat round-trip self-test
        run: python3 build/geodat.py

      - name: Unit tests
        run: python3 build/test_units.py
