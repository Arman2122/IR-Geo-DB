name: IP attribution problem
description: An IP prefix is in the wrong set, or missing from the Iranian set
labels: ["ip-data"]
body:
  - type: markdown
    attributes:
      value: |
        `ir` is the Regional Internet Registries' delegation records adjusted
        by routing data: an address can be in `ir`, or out of it, because of
        which network announces it, not only because of who it was delegated
        to. So a genuine problem is a registry error, an odd route, or a bug
        here.

        Check first whether the address is in `ir-cdn` rather than `ir`. Those
        are separate sets on purpose — `ir-cdn` carries each Iranian provider's
        published ranges plus what its networks announce, and some of those are
        foreign edge nodes.

  - type: input
    id: prefix
    attributes:
      label: Prefix or address
      placeholder: "5.160.0.0/16"
    validations:
      required: true

  - type: input
    id: origin_as
    attributes:
      label: Origin AS
      description: The AS that announces the prefix (bgp.he.net or RIPEstat shows it). Leave empty if it is not announced.
      placeholder: "AS42337"

  - type: dropdown
    id: kind
    attributes:
      label: Problem
      options:
        - In the Iranian set but should not be
        - Missing from the Iranian set but should be there
        - In the wrong set (ir vs ir-cdn vs ir-full)
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: whois output, the RIR record, a traceroute — whatever shows it
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Release
      placeholder: "v2026.08.03"
